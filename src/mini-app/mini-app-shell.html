<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Алерты маркета</title>
  <style>
    :root {
      --bg: #1c1c1c;
      --card: #2b2b2b;
      --accent: #3390ec;
      --text: #e8e8e8;
      --muted: #8e8e93;
      --radius: 12px;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 88px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #333;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .topbar .ghost { width: 28px; height: 28px; }
    main { padding: 16px; }
    h2.section-title { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--text); }
    .premium-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .premium-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge-free {
      background: #3a3a3c;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .quota-label { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .quota-bar {
      height: 6px;
      background: #3a3a3c;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .quota-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.2s; }
    .btn-premium {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs {
      display: flex;
      background: var(--card);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .filter-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid #333;
    }
    .filter-card .title { font-weight: 600; margin-bottom: 6px; }
    .filter-card .meta { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #333;
    }
    .dock-search {
      flex: 1;
      height: 44px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid #444;
      padding: 0 14px;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .fab {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    #err { color: var(--danger); font-size: 14px; margin-bottom: 12px; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg);
      width: 100%;
      max-height: 88vh;
      border-radius: 16px 16px 0 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-head h3 { margin: 0; font-size: 17px; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .field-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: block; }
    .input, .select-like {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid #444;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 14px;
    }
    .select-like { cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-cancel {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: var(--radius);
      border: 1px solid #444;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }
    .btn-save {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      flex-direction: column;
      justify-content: flex-end;
    }
    .picker-overlay.open { display: flex; }
    .picker-sheet {
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }
    .picker-search { margin: 12px 16px 8px; }
    .picker-search input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #444;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }
    .picker-list { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
    .picker-item {
      padding: 14px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .picker-item:active { background: var(--card); }
    .picker-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #3a3a3c;
      flex-shrink: 0;
    }
    .subhint { font-size: 12px; color: var(--muted); margin: -10px 0 14px; }
    .group-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 0 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="ghost"></span>
    <h1>Алерты маркета</h1>
    <span class="ghost"></span>
  </div>
  <main>
    <h2 class="section-title">Фильтры подарков</h2>
    <div id="err"></div>
    <div class="premium-card">
      <div class="premium-row">
        <span class="badge-free" id="tier-badge">Free</span>
      </div>
      <div class="quota-label">Листинг: <span id="q-list-used">0</span> / <span id="q-list-max">1</span></div>
      <div class="quota-bar"><div class="quota-fill" id="q-list-fill" style="width:0%"></div></div>
      <div class="quota-label" style="margin-top:12px">Продажа: <span id="q-sale-used">0</span> / <span id="q-sale-max">1</span></div>
      <div class="quota-bar"><div class="quota-fill" id="q-sale-fill" style="width:0%"></div></div>
      <button type="button" class="btn-premium" id="btn-premium">⚡ Получить премиум</button>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="listing">Листинг</button>
      <button type="button" class="tab" data-tab="sale">Продажа</button>
    </div>
    <div id="filters-wrap"></div>
  </main>
  <div class="dock">
    <div class="dock-search">🔍 Поиск…</div>
    <button type="button" class="fab" id="fab-add" aria-label="Добавить">+</button>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Создать фильтр</h3>
        <button type="button" class="modal-close" id="modal-close">×</button>
      </div>
      <div class="group-title">Основные параметры</div>
      <label class="field-label">Подарок</label>
      <button type="button" class="select-like" id="pick-gift">
        <span id="pick-gift-label">Выберите подарок</span>
        <span>▾</span>
      </button>
      <label class="field-label">Или номер подарка</label>
      <input type="text" inputmode="numeric" class="input" id="inp-serial" placeholder="Введите номер подарка" />
      <div class="group-title">Цена</div>
      <div class="row2">
        <div>
          <label class="field-label">От</label>
          <input type="text" inputmode="decimal" class="input" id="inp-min" placeholder="TON" />
        </div>
        <div>
          <label class="field-label">До</label>
          <input type="text" inputmode="decimal" class="input" id="inp-max" placeholder="TON" />
        </div>
      </div>
      <p class="subhint" id="sale-hint" style="display:none">Уведомления по продажам скоро подключим к потоку событий.</p>
      <button type="button" class="btn-cancel" id="modal-cancel">Отмена</button>
      <button type="button" class="btn-save" id="modal-save">Сохранить фильтр</button>
    </div>
  </div>

  <div class="picker-overlay" id="picker-overlay">
    <div class="picker-sheet">
      <div class="picker-search"><input type="search" id="gift-search" placeholder="Поиск…" /></div>
      <div class="picker-list" id="gift-list"></div>
    </div>
  </div>

  <script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var initData = tg && tg.initData ? tg.initData : '';
  var API = __API_PREFIX__;
  function hdr() {
    return { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData };
  }
  var tab = 'listing';
  var collections = [];
  var pickedGift = '';

  function api(path, opts) {
    return fetch((API || '') + path, opts || {}).then(function (r) { return r.json(); });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.tab').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-tab') === t);
    });
    document.getElementById('sale-hint').style.display = t === 'sale' ? 'block' : 'none';
    loadFilters();
  }

  function loadMe() {
    api('/mini/me', { headers: hdr() }).then(function (d) {
      if (!d.ok) return;
      document.getElementById('tier-badge').textContent =
        d.tier === 'premium' ? 'Premium' : d.tier === 'pro' ? 'Pro' : 'Free';
      var lu = d.listingAlertsToday, ll = d.listingAlertLimit;
      document.getElementById('q-list-used').textContent = lu;
      document.getElementById('q-list-max').textContent = ll;
      document.getElementById('q-list-fill').style.width = Math.min(100, (lu / Math.max(ll, 1)) * 100) + '%';
      var su = d.saleAlertsToday, sl = d.saleAlertLimit;
      document.getElementById('q-sale-used').textContent = su;
      document.getElementById('q-sale-max').textContent = sl;
      document.getElementById('q-sale-fill').style.width = Math.min(100, (su / Math.max(sl, 1)) * 100) + '%';
    });
  }

  function formatFilterSummary(c) {
    var parts = [];
    if (c.collectionsInclude && c.collectionsInclude.length)
      parts.push(c.collectionsInclude.join(', '));
    if (c.giftSerial != null) parts.push('#' + c.giftSerial);
    if (c.minPriceTon != null || c.maxPriceTon != null)
      parts.push('Цена ' + (c.minPriceTon != null ? c.minPriceTon : '…') + '–' + (c.maxPriceTon != null ? c.maxPriceTon : '…') + ' TON');
    if (c.belowFloorPercentMin != null) parts.push('≥' + c.belowFloorPercentMin + '% ниже пола');
    if (!parts.length) parts.push('MRKT · базовые условия');
    return parts.join(' · ');
  }

  function loadFilters() {
    var errEl = document.getElementById('err');
    var wrap = document.getElementById('filters-wrap');
    errEl.textContent = '';
    api('/mini/filters?tab=' + encodeURIComponent(tab), { headers: hdr() }).then(function (d) {
      if (!d.ok) { errEl.textContent = d.reason || 'Ошибка'; return; }
      var rows = d.filters || [];
      if (!rows.length) {
        wrap.innerHTML = '<div class="empty-state">Фильтры не найдены<br/>Создайте первый фильтр</div>';
        return;
      }
      wrap.innerHTML = rows.map(function (f) {
        return '<div class="filter-card"><div class="title">' + escapeHtml(f.name) + '</div>' +
          '<div class="meta">' + escapeHtml(formatFilterSummary(f.criteria || {})) + '</div></div>';
      }).join('');
    }).catch(function () { errEl.textContent = 'Не удалось загрузить'; });
  }

  function loadCollections() {
    api('/mini/collections', { headers: hdr() }).then(function (d) {
      if (d.ok && d.names) collections = d.names;
      renderGiftList('');
    });
  }

  function renderGiftList(q) {
    var ql = (q || '').toLowerCase();
    var list = document.getElementById('gift-list');
    var names = collections.filter(function (n) { return !ql || n.toLowerCase().indexOf(ql) >= 0; }).slice(0, 200);
    list.innerHTML = names.map(function (n) {
      return '<div class="picker-item" data-name="' + escapeHtml(n).replace(/"/g,'&quot;') + '">' +
        '<div class="picker-icon"></div><span>' + escapeHtml(n) + '</span></div>';
    }).join('');
    list.querySelectorAll('.picker-item').forEach(function (el) {
      el.onclick = function () {
        pickedGift = el.getAttribute('data-name') || '';
        document.getElementById('pick-gift-label').textContent = pickedGift || 'Выберите подарок';
        document.getElementById('picker-overlay').classList.remove('open');
      };
    });
  }

  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.onclick = function () { setTab(btn.getAttribute('data-tab')); };
  });
  document.getElementById('fab-add').onclick = function () {
    pickedGift = '';
    document.getElementById('pick-gift-label').textContent = 'Выберите подарок';
    document.getElementById('inp-serial').value = '';
    document.getElementById('inp-min').value = '';
    document.getElementById('inp-max').value = '';
    document.getElementById('modal-overlay').classList.add('open');
  };
  document.getElementById('modal-close').onclick = document.getElementById('modal-cancel').onclick = function () {
    document.getElementById('modal-overlay').classList.remove('open');
  };
  document.getElementById('pick-gift').onclick = function () {
    document.getElementById('picker-overlay').classList.add('open');
    document.getElementById('gift-search').value = '';
    renderGiftList('');
    if (!collections.length) loadCollections();
  };
  document.getElementById('gift-search').oninput = function () {
    renderGiftList(document.getElementById('gift-search').value);
  };
  document.getElementById('picker-overlay').onclick = function (e) {
    if (e.target === document.getElementById('picker-overlay')) document.getElementById('picker-overlay').classList.remove('open');
  };
  document.getElementById('modal-save').onclick = function () {
    var errEl = document.getElementById('err');
    errEl.textContent = '';
    var serialRaw = document.getElementById('inp-serial').value.trim();
    var serial = serialRaw === '' ? null : parseInt(serialRaw, 10);
    var minT = parseFloat(document.getElementById('inp-min').value.replace(',', '.'));
    var maxT = parseFloat(document.getElementById('inp-max').value.replace(',', '.'));
    var body = {
      tab: tab,
      collectionDisplay: pickedGift || null,
      giftSerial: Number.isFinite(serial) ? serial : null,
      minPriceTon: Number.isFinite(minT) ? minT : null,
      maxPriceTon: Number.isFinite(maxT) ? maxT : null,
    };
    fetch((API || '') + '/mini/filters', { method: 'POST', headers: hdr(), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { errEl.textContent = d.reason || 'Ошибка сохранения'; return; }
        document.getElementById('modal-overlay').classList.remove('open');
        loadFilters();
        loadMe();
      })
      .catch(function () { errEl.textContent = 'Сеть недоступна'; });
  };
  document.getElementById('btn-premium').onclick = function () {
    if (tg) tg.showAlert('Premium скоро: мгновенные алерты и больше фильтров.');
    else alert('Premium скоро');
  };

  loadMe();
  loadFilters();
})();
  </script>
</body>
</html>
