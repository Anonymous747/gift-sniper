# CI: build Docker image on every push / PR.
# CD: SSH deploy on push to main.
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST       — server hostname or IP
#   SSH_USER       — SSH login (e.g. deploy)
#   SSH_PRIVATE_KEY — full private key (PEM) with access to the server
#   DEPLOY_PATH    — absolute path to the git clone on the server (e.g. /opt/gift-sniper)
#
# One-time on the server: install Docker + Compose plugin, clone this repo, copy `.env.example`
# to `.env`, set secrets, then push to `main` to deploy.
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: gift-sniper

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH secret is not set"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            if [ ! -f .env ]; then cp .env.example .env; fi
            docker compose pull postgres redis 2>/dev/null || true
            docker compose up -d --build
            docker compose ps
