# CI: build Docker image on every push / PR.
# CD: SSH deploy on push to main (or manual “Run workflow” on main).
#
# --- .env and CI/CD (read this) ---
# `.env` is gitignored: it is NOT stored in the repo and is NOT deployed by `git pull`.
# On the server, `git reset --hard origin/main` does NOT remove an existing `.env` (untracked file).
#
# How `.env` gets on the server:
#   A) Manual (default): SSH once, `cp .env.example .env`, edit secrets. Every later deploy keeps that file.
#   B) From GitHub (optional): set secret SERVER_DOTENV_B64 to the base64 of your full `.env` file.
#      Each deploy uploads it to `/opt/gift-sniper/.env` before `docker compose up` (overwrites).
#      Encode locally: `base64 < .env | tr -d '\n'`
#
# Fixed deploy directory on the server: /opt/gift-sniper (clone this repo there once).
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
#   SERVER_DOTENV_B64 — optional; full .env file as one-line base64 (see above)
#
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Enables the “Run workflow” button (Actions → CI / CD → Run workflow).
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: gift-sniper
  # Clone this repository exactly here on the server (e.g. `git clone … /opt/gift-sniper`).
  DEPLOY_PATH: /opt/gift-sniper

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Decode SERVER_DOTENV_B64 for upload (optional)
        id: remote_env
        env:
          B64: ${{ secrets.SERVER_DOTENV_B64 }}
        run: |
          if [ -z "${B64}" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "No SERVER_DOTENV_B64 secret — server will keep an existing .env or create from .env.example."
          else
            printf '%s' "$B64" | base64 -d > .env
            if [ ! -s .env ]; then
              echo "SERVER_DOTENV_B64 decoded to empty file"
              exit 1
            fi
            chmod 600 .env
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "Will upload .env from SERVER_DOTENV_B64 (${#B64} base64 chars)."
          fi

      # scp-action requires `target` to be a remote directory; basename of `source` becomes `.env` there.
      - name: Upload .env to server
        if: steps.remote_env.outputs.upload == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .env
          target: ${{ env.DEPLOY_PATH }}/

      - name: Remove local .env artifact
        if: always()
        run: rm -f .env

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            echo "==> Git: fetch + reset to origin/main"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "==> .env"
            if [ -f .env ]; then
              echo "Using existing .env"
            else
              test -f .env.example || { echo "ERROR: .env.example missing in repo checkout"; exit 1; }
              cp .env.example .env
              echo "Created .env from .env.example (configure secrets on server or use SERVER_DOTENV_B64)"
            fi
            echo "==> Docker Compose"
            if docker compose version >/dev/null 2>&1; then
              dcompose() { docker compose "$@"; }
            elif command -v docker-compose >/dev/null 2>&1; then
              dcompose() { docker-compose "$@"; }
            else
              echo "ERROR: neither 'docker compose' nor 'docker-compose' is available."
              exit 1
            fi
            dcompose version
            dcompose pull postgres redis 2>/dev/null || true
            if ! dcompose up -d --build; then
              echo "ERROR: docker compose up --build failed. Recent service logs:"
              dcompose logs --tail=120 2>/dev/null || true
              exit 1
            fi
            dcompose ps
